name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: V3C.40 Release Readiness Check
        id: readiness
        run: npm run release-readiness
        continue-on-error: true

      - name: Generate Job Summary
        if: always()
        run: |
          if [ "${{ steps.readiness.outcome }}" = "success" ]; then
            echo "## V3C.40 Release Readiness: ✅ PASS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All repository validation gates passed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Validation Gates" >> $GITHUB_STEP_SUMMARY
            echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lint | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| Format | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| Typecheck | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| Tests | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| Build | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "## V3C.40 Release Readiness: ❌ FAIL" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "One or more validation gates failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check Release Readiness
        if: steps.readiness.outcome == 'failure'
        run: |
          echo "Release readiness check failed."
          exit 1
